<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c447c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#185fa5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- アイコン部分：Tを模した四角＋ライン -->
  <rect x="0" y="10" width="56" height="56" rx="10" fill="url(#grad)" />
  <!-- T字のタテ棒 -->
  <rect x="24" y="20" width="8" height="36" rx="2" fill="white" />
  <!-- T字のヨコ棒 -->
  <rect x="12" y="20" width="32" height="8" rx="2" fill="white" />

  <!-- サービス名 -->
  <text x="72" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" fill="#0c447c" letter-spacing="2">Tanomi</text>

  <!-- タグライン -->
  <text x="73" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#185fa5" letter-spacing="3">OUTSOURCE MANAGEMENT</text>

  <!-- 区切りライン -->
  <line x1="72" y1="50" x2="260" y2="50" stroke="#185fa5" stroke-width="1" opacity="0.3" />
</svg>
